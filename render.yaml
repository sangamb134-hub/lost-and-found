# Render Blueprint — Campus Lost and Found Management System
# Free tier compatible — no new database created.
# Set DATABASE_URL manually in the Render dashboard using your existing
# free PostgreSQL database connection string.

services:
  - type: web
    name: lost-and-found
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true

    envVars:
      - key: SECRET_KEY
        sync: false

      - key: FLASK_ENV
        value: production

      - key: FLASK_APP
        value: wsgi.py

      # Set this manually in the Render dashboard:
      # use your existing free PostgreSQL Internal Database URL
      - key: DATABASE_URL
        sync: false

      - key: PORT
        value: 10000

      - key: ADMIN_EMAIL
        value: admin@lostfound.local

      - key: ADMIN_PASSWORD
        sync: false
