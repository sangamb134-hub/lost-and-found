# Render Blueprint — Campus Lost and Found Management System
# Free tier compatible (no preDeployCommand)

databases:
  - name: lostfound-db
    databaseName: lostfound
    plan: free

services:
  - type: web
    name: lost-and-found
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true

    envVars:
      - key: SECRET_KEY
        sync: false

      - key: FLASK_ENV
        value: production

      - key: FLASK_APP
        value: wsgi.py

      - key: DATABASE_URL
        fromDatabase:
          name: lostfound-db
          property: connectionString

      - key: PORT
        value: 10000

      - key: ADMIN_EMAIL
        value: admin@lostfound.local

      - key: ADMIN_PASSWORD
        sync: false
